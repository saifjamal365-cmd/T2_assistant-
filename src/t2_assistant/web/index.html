<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>T2 Assistant</title>
  <style>
    :root {
      --bg: #f7f5f1;            /* warm paper background */
      --surface: #ffffff;       /* sidebar / input bar */
      --border: #e7e2da;        /* warm hairline */
      --text: #24211d;          /* warm near-black */
      --muted: #8a8478;         /* warm secondary text */
      --accent: #c96442;        /* clay / terracotta */
      --accent-hover: #b5573a;
      --accent-soft: #f3e4dc;   /* light tint of the accent */
    }
    * { box-sizing: border-box; }
    body { margin: 0; -webkit-font-smoothing: antialiased;
           font: 15px/1.6 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
           color: var(--text); background: var(--bg); height: 100vh; display: flex; }

    /* sidebar */
    #sidebar { width: 260px; border-right: 1px solid var(--border); background: var(--surface);
               display: flex; flex-direction: column; }
    #sidebar h1 { font-size: 16px; margin: 0; padding: 18px 16px; color: var(--text);
                  font-weight: 600; border-bottom: 1px solid var(--border); }
    #userBar { display: flex; align-items: center; gap: 8px; padding: 10px 16px;
               border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }
    #userEmail { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #signOut { border: none; background: none; color: var(--accent); cursor: pointer;
               font-size: 12.5px; padding: 0; }
    #signOut:hover { color: var(--accent-hover); text-decoration: underline; }
    #new, #newFolder { margin: 12px 12px 0; padding: 9px 12px; border: 1px solid var(--border); color: var(--text);
           background: var(--surface); border-radius: 10px; cursor: pointer; font-size: 14px;
           transition: background .15s ease, border-color .15s ease; display: block; width: calc(100% - 24px); text-align: left; }
    #newFolder { margin: 6px 12px 6px; font-size: 13px; color: var(--muted); }
    #new:hover, #newFolder:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-hover); }
    #convs { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
    .conv { padding: 9px 10px; border-radius: 10px; cursor: pointer; font-size: 14px;
            display: flex; align-items: center; gap: 6px;
            transition: background .15s ease; }
    .conv:hover { background: #f1eee7; }
    .conv.active { background: var(--accent-soft); color: var(--accent-hover); font-weight: 600; }
    .conv .convTitle { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv small { color: var(--muted); font-weight: 400; display: block; }
    .convActions { display: none; gap: 2px; flex-shrink: 0; }
    .conv:hover .convActions { display: flex; }
    .convActions button { border: none; background: none; cursor: pointer; font-size: 12.5px;
            padding: 3px 4px; border-radius: 6px; opacity: .6; line-height: 1; }
    .convActions button:hover { opacity: 1; background: #e7e2da; }
    .folderHeader { display: flex; align-items: center; gap: 6px; padding: 8px 10px 4px;
            font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase;
            letter-spacing: .03em; cursor: pointer; margin-top: 6px; }
    .folderHeader .arrow { transition: transform .15s ease; display: inline-block; font-size: 10px; }
    .folderHeader.collapsed .arrow { transform: rotate(-90deg); }
    .folderHeader .folderName { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .folderHeader .convActions { }
    .folderHeader:hover .convActions { display: flex; }
    .folderGroup.collapsed .folderItems { display: none; }
    .moveMenu { padding: 2px 10px 8px; }
    .moveMenu select { width: 100%; padding: 5px 8px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 13px; background: var(--bg); color: var(--text); }
    #convs::-webkit-scrollbar, #log::-webkit-scrollbar { width: 8px; }
    #convs::-webkit-scrollbar-thumb, #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

    /* chat */
    #main { flex: 1; display: flex; flex-direction: column; }
    #log { flex: 1; overflow-y: auto; padding: 28px 24px; }
    #log .empty { color: var(--muted); text-align: center; margin-top: 20vh; font-size: 15px; }
    .msg { max-width: 720px; margin: 0 auto 20px; display: flex; flex-direction: column; }
    .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .bubble { padding: 12px 16px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg.user { align-items: flex-end; }
    .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot .bubble { background: transparent; border: none; padding: 2px 0 0;
                        border-radius: 0; }
    .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
           background: var(--accent-soft); color: var(--accent-hover); margin-bottom: 6px; }
    .tag.answer { background: #e4ede1; color: #4f7a45; }
    .tag.clarify { background: #fcefd9; color: #a46b12; }
    .tag.summarise { background: #ede7f6; color: #6a4fa0; }
    .foot { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
    .foot button { border: none; background: none; cursor: pointer; font-size: 14px; padding: 0 2px; opacity: .55; }
    .foot button:hover, .foot button.on { opacity: 1; }
    .foot a { color: var(--accent); text-decoration: none; }
    .foot a:hover { color: var(--accent-hover); text-decoration: underline; }

    /* clickable sources */
    .bubble .src { color: var(--accent); cursor: pointer; font-weight: 600;
                   border-bottom: 1px dashed var(--accent); }
    .bubble .src:hover, .bubble .src.srcOpen { color: var(--accent-hover); }
    .citation { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--border);
                border-radius: 12px; background: var(--surface); max-width: 640px; }
    .citationHead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .citationMeta { font-size: 12px; color: var(--muted); }
    .citationClose { margin-left: auto; border: none; background: none; cursor: pointer;
                      font-size: 16px; color: var(--muted); line-height: 1; padding: 0 2px; }
    .citationClose:hover { color: var(--text); }
    .citationText { font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere;
                     background: var(--bg); border-radius: 8px; padding: 10px 12px;
                     max-height: 220px; overflow-y: auto; }
    .citationLink { display: inline-block; margin-top: 8px; font-size: 12.5px;
                     color: var(--accent); text-decoration: none; }
    .citationLink:hover { text-decoration: underline; }
    .citationText mark { background: #fcefd9; color: var(--accent-hover); padding: 1px 3px;
                     border-radius: 3px; font-weight: 600; }

    /* small modal dialogs (rename / new folder / delete confirm) */
    .modalOverlay { position: fixed; inset: 0; background: rgba(36,33,29,.35); display: flex;
            align-items: center; justify-content: center; z-index: 50; }
    .modalBox { background: var(--surface); border-radius: 14px; padding: 20px; width: 320px;
            box-shadow: 0 12px 32px rgba(0,0,0,.18); }
    .modalTitle { font-size: 14.5px; font-weight: 600; margin-bottom: 12px; color: var(--text); }
    .modalInput { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px;
            font: inherit; background: var(--bg); color: var(--text); margin-bottom: 14px; }
    .modalInput:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .modalActions { display: flex; justify-content: flex-end; gap: 8px; }
    .modalActions button { padding: 7px 14px; border-radius: 9px; font-size: 13.5px; cursor: pointer;
            border: 1px solid var(--border); background: var(--surface); color: var(--text); }
    .modalActions .modalOk { background: var(--accent); color: #fff; border-color: var(--accent); }
    .modalActions .modalOk:hover { background: var(--accent-hover); }
    .modalActions .modalDanger { background: #c94242; color: #fff; border-color: #c94242; }
    .modalActions .modalDanger:hover { background: #a83636; }
    .modalActions .modalCancel:hover { background: #f1eee7; }

    /* sign-in overlay */
    #authOverlay .modalBox { width: 360px; }
    #authOverlay .modalActions { justify-content: stretch; }
    #authOverlay .modalActions button { flex: 1; }
    .authHint { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .authError { font-size: 12.5px; color: #c94242; margin: -8px 0 12px; min-height: 1em; }

    /* input */
    #bar { border-top: 1px solid var(--border); background: var(--surface); padding: 16px 24px; }
    #bar form { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; }
    #text { flex: 1; resize: none; padding: 11px 14px; border: 1px solid var(--border);
            border-radius: 14px; font: inherit; max-height: 140px; background: var(--bg);
            color: var(--text); transition: border-color .15s ease, box-shadow .15s ease; }
    #text:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    #send { padding: 0 22px; border: none; background: var(--accent); color: #fff;
            border-radius: 14px; cursor: pointer; font-size: 14px; font-weight: 500;
            transition: background .15s ease; }
    #send:hover:not(:disabled) { background: var(--accent-hover); }
    #send:disabled { opacity: .5; cursor: default; }

    /* sidebar nav (chat / knowledge base) */
    #nav { display: flex; gap: 6px; padding: 0 12px 10px; }
    #nav button { flex: 1; padding: 7px 8px; border: 1px solid transparent; background: none;
                  color: var(--muted); border-radius: 8px; cursor: pointer; font-size: 13px;
                  font-weight: 500; transition: background .15s ease, color .15s ease; }
    #nav button:hover { background: #f1eee7; }
    #nav button.active { background: var(--accent-soft); color: var(--accent-hover); }

    /* knowledge base panel */
    #kb { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    #kbTop { padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--surface);
             display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    #kbTop input[type="search"] { flex: 1; min-width: 200px; padding: 9px 12px; border: 1px solid var(--border);
             border-radius: 10px; font: inherit; background: var(--bg); color: var(--text); }
    #kbTop select { padding: 9px 10px; border: 1px solid var(--border); border-radius: 10px;
             font: inherit; background: var(--bg); color: var(--text); }
    #kbCount { font-size: 12px; color: var(--muted); white-space: nowrap; }
    #kbBody { flex: 1; display: flex; overflow: hidden; }
    #kbList { width: 340px; border-right: 1px solid var(--border); overflow-y: auto; padding: 8px; }
    #kbList::-webkit-scrollbar { width: 8px; }
    #kbList::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
    .kbItem { padding: 10px 12px; border-radius: 10px; cursor: pointer; margin-bottom: 2px; }
    .kbItem:hover { background: #f1eee7; }
    .kbItem.active { background: var(--accent-soft); }
    .kbItem .t { font-size: 13.5px; font-weight: 500; color: var(--text); }
    .kbItem .m { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .kbBadge { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 999px;
               background: #e4ede1; color: #4f7a45; margin-left: 6px; }
    .kbBadge.superseded { background: #fcefd9; color: #a46b12; }
    #kbDetail { flex: 1; overflow-y: auto; padding: 28px 32px; }
    #kbDetail::-webkit-scrollbar { width: 8px; }
    #kbDetail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
    #kbDetail .empty { color: var(--muted); text-align: center; margin-top: 20vh; }
    #kbDetailHead h2 { margin: 0 0 6px; font-size: 20px; }
    #kbDetailMeta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    #kbDetailMeta span { font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
               background: var(--accent-soft); color: var(--accent-hover); }
    #kbDetailText { max-width: 760px; white-space: pre-wrap; overflow-wrap: anywhere;
               font-size: 15px; line-height: 1.7; }
  </style>
</head>
<body>
  <aside id="sidebar">
    <h1>T2 Assistant</h1>
    <div id="userBar">
      <span id="userEmail"></span>
      <button id="signOut">Sign out</button>
    </div>
    <div id="nav">
      <button id="navChat" class="active">Chat</button>
      <button id="navKb">Knowledge Base</button>
    </div>
    <button id="new">+ New chat</button>
    <button id="newFolder">+ New folder</button>
    <div id="convs"></div>
  </aside>

  <section id="main">
    <div id="log"><div class="empty">Ask a question about company policy, or paste meeting notes to summarise.</div></div>
    <div id="bar">
      <form id="form">
        <textarea id="text" rows="1" placeholder="Type a message…" autocomplete="off"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </div>
  </section>

  <section id="kb">
    <div id="kbTop">
      <input id="kbSearch" type="search" placeholder="Search documents by title…" />
      <select id="kbDept"><option value="">All departments</option></select>
      <select id="kbLang">
        <option value="">Both languages</option>
        <option value="en">English</option>
        <option value="ar">Arabic</option>
      </select>
      <select id="kbType">
        <option value="">All types</option>
        <option value="Policy">Policy</option>
        <option value="Procedure">Procedure</option>
        <option value="FAQ">FAQ</option>
        <option value="Quick Reference">Quick Reference</option>
      </select>
      <span id="kbCount"></span>
    </div>
    <div id="kbBody">
      <div id="kbList"></div>
      <div id="kbDetail"><div class="empty">Pick a document from the list to read it.</div></div>
    </div>
  </section>

  <div id="authOverlay" class="modalOverlay" style="display:none;">
    <div class="modalBox">
      <div class="modalTitle">Sign in to T2 Assistant</div>
      <div id="authStep1">
        <div class="authHint">Use your company email to get a one-time sign-in code.</div>
        <input id="authEmail" class="modalInput" type="email" placeholder="you@t2.sa" autocomplete="email" />
        <div id="authError1" class="authError"></div>
        <div class="modalActions">
          <button id="authSendCode" class="modalOk">Send code</button>
        </div>
      </div>
      <div id="authStep2" style="display:none;">
        <div class="authHint">Code sent to <b id="authEmailShown"></b> - check your inbox.</div>
        <input id="authCode" class="modalInput" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" />
        <div id="authError2" class="authError"></div>
        <div class="modalActions">
          <button id="authBack" class="modalCancel">Back</button>
          <button id="authVerify" class="modalOk">Verify</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const log = document.getElementById("log");
    const convs = document.getElementById("convs");
    const form = document.getElementById("form");
    const text = document.getElementById("text");
    const send = document.getElementById("send");
    // remembered across a page reload, so refreshing does not silently start
    // a new conversation and split the history in two
    let conversationId = null;
    try { conversationId = localStorage.getItem("t2_conversation_id"); } catch (e) { /* ignore */ }

    const isArabic = (s) => /[؀-ۿ]/.test(s);
    const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    const fmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");

    function linkifySources(html, sources) {
      if (!sources || !sources.length) return { html, byId: new Map() };
      const byId = new Map(sources.map((s) => [s.doc_id, s]));
      const linked = html.replace(/\b([A-Z]{2,4}-\d{3,4})\b/g, (m) =>
        byId.has(m) ? `<span class="src" data-doc="${m}">${m}</span>` : m
      );
      return { html: linked, byId };
    }

    function markHighlights(escapedText, highlights) {
      let out = escapedText;
      for (const h of highlights || []) {
        const escH = esc(h);
        if (escH && out.includes(escH)) out = out.split(escH).join(`<mark>${escH}</mark>`);
      }
      return out;
    }

    function citationPanel(source) {
      const box = document.createElement("div");
      box.className = "citation";
      const dir = isArabic(source.text) ? ' dir="rtl"' : "";
      const marked = markHighlights(esc(source.text), source.highlights)
        .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>");
      box.innerHTML =
        `<div class="citationHead"><b>${esc(source.title)}</b>` +
        `<span class="citationMeta">${esc(source.doc_id)} · ${esc(source.doc_type)} · v${esc(source.version)}</span>` +
        `<button class="citationClose" title="Close">×</button></div>` +
        `<div class="citationText"${dir}>${marked}</div>` +
        `<a class="citationLink" href="#">View full document →</a>`;
      box.querySelector(".citationClose").onclick = () => box.remove();
      box.querySelector(".citationLink").onclick = (e) => {
        e.preventDefault();
        showKb();
        openKbDocument(source.doc_id);
      };
      return box;
    }

    function addMsg(role, content, route, meta, sources) {
      const empty = log.querySelector(".empty");
      if (empty) empty.remove();
      const wrap = document.createElement("div");
      wrap.className = "msg " + (role === "user" ? "user" : "bot");
      const tag = route ? `<span class="tag ${route}">${route}</span>` : "";
      const dir = isArabic(content) ? ' dir="rtl"' : "";
      const { html, byId } = linkifySources(fmt(content), sources);
      wrap.innerHTML =
        `<span class="who">${role === "user" ? "You" : "Assistant"}</span>` +
        tag +
        `<div class="bubble"${dir}>${html}</div>`;
      if (byId.size) {
        wrap.querySelectorAll(".src").forEach((el) => {
          el.onclick = () => {
            const wasOpen = el.classList.contains("srcOpen");
            const existing = wrap.querySelector(".citation");
            if (existing) existing.remove();
            wrap.querySelectorAll(".src").forEach((s) => s.classList.remove("srcOpen"));
            if (wasOpen) return;  // clicking the open one again just closes it
            el.classList.add("srcOpen");
            const panel = citationPanel(byId.get(el.dataset.doc));
            wrap.appendChild(panel);
            const mark = panel.querySelector("mark");
            if (mark) mark.scrollIntoView({ block: "center" });
          };
        });
      }
      if (meta && meta.runId) wrap.appendChild(feedbackBar(meta));
      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
      return wrap;
    }

    function feedbackBar(meta) {
      const bar = document.createElement("div");
      bar.className = "foot";
      const up = document.createElement("button");
      const down = document.createElement("button");
      up.textContent = "👍"; down.textContent = "👎";
      const rate = async (helpful, btn) => {
        up.classList.remove("on"); down.classList.remove("on");
        btn.classList.add("on");
        try {
          await fetch(`/runs/${meta.runId}/feedback`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ helpful }),
          });
        } catch (e) { /* keep the visual state anyway */ }
      };
      up.onclick = () => rate(true, up);
      down.onclick = () => rate(false, down);
      bar.append(up, down);
      if (meta.traceUrl) {
        const link = document.createElement("a");
        link.href = meta.traceUrl; link.target = "_blank"; link.textContent = "trace ↗";
        bar.appendChild(link);
      }
      return bar;
    }

    function showPrompt(title, defaultValue, onConfirm) {
      const overlay = document.createElement("div");
      overlay.className = "modalOverlay";
      overlay.innerHTML =
        `<div class="modalBox">
           <div class="modalTitle">${esc(title)}</div>
           <input class="modalInput" type="text" />
           <div class="modalActions">
             <button class="modalCancel">Cancel</button>
             <button class="modalOk">OK</button>
           </div>
         </div>`;
      document.body.appendChild(overlay);
      const input = overlay.querySelector(".modalInput");
      input.value = defaultValue || "";
      input.focus();
      input.select();
      const close = () => overlay.remove();
      overlay.querySelector(".modalCancel").onclick = close;
      overlay.onclick = (e) => { if (e.target === overlay) close(); };
      const confirmIt = () => {
        const value = input.value.trim();
        close();
        if (value) onConfirm(value);
      };
      overlay.querySelector(".modalOk").onclick = confirmIt;
      input.onkeydown = (e) => {
        if (e.key === "Enter") confirmIt();
        if (e.key === "Escape") close();
      };
    }

    function showConfirm(message, onConfirm) {
      const overlay = document.createElement("div");
      overlay.className = "modalOverlay";
      overlay.innerHTML =
        `<div class="modalBox">
           <div class="modalTitle">${esc(message)}</div>
           <div class="modalActions">
             <button class="modalCancel">Cancel</button>
             <button class="modalDanger">Delete</button>
           </div>
         </div>`;
      document.body.appendChild(overlay);
      const close = () => overlay.remove();
      overlay.querySelector(".modalCancel").onclick = close;
      overlay.onclick = (e) => { if (e.target === overlay) close(); };
      overlay.querySelector(".modalDanger").onclick = () => { close(); onConfirm(); };
    }

    const collapsedFolders = new Set();
    try {
      const saved = JSON.parse(localStorage.getItem("t2_collapsed_folders") || "[]");
      saved.forEach((id) => collapsedFolders.add(id));
    } catch (e) { /* ignore */ }
    function saveCollapsed() {
      try { localStorage.setItem("t2_collapsed_folders", JSON.stringify([...collapsedFolders])); }
      catch (e) { /* ignore */ }
    }

    async function apiJson(method, url, body) {
      await fetch(url, {
        method,
        headers: body ? { "Content-Type": "application/json" } : undefined,
        body: body ? JSON.stringify(body) : undefined,
      });
    }

    async function loadConversations() {
      const [list, folders] = await Promise.all([
        fetch("/conversations").then((r) => r.json()),
        fetch("/folders").then((r) => r.json()),
      ]);
      convs.innerHTML = "";

      const byFolder = new Map(folders.map((f) => [f.id, []]));
      const unfiled = [];
      for (const c of list) {
        if (c.folder_id && byFolder.has(c.folder_id)) byFolder.get(c.folder_id).push(c);
        else unfiled.push(c);
      }
      for (const folder of folders) {
        renderFolderGroup(folder.id, folder.name, byFolder.get(folder.id) || [], folders);
      }
      if (unfiled.length || folders.length === 0) {
        renderFolderGroup(null, folders.length ? "No folder" : null, unfiled, folders);
      }
    }

    function renderFolderGroup(folderId, folderName, items, allFolders) {
      const key = folderId || "__none__";
      if (folderName) {
        const collapsed = collapsedFolders.has(key);
        const header = document.createElement("div");
        header.className = "folderHeader" + (collapsed ? " collapsed" : "");
        header.innerHTML =
          `<span class="arrow">▾</span><span class="folderName">${esc(folderName)}</span>` +
          (folderId
            ? `<span class="convActions">
                 <button class="newInFolderBtn" title="New chat in this folder">+</button>
                 <button class="renameFolderBtn" title="Rename folder">✏️</button>
                 <button class="deleteFolderBtn" title="Delete folder">🗑️</button>
               </span>`
            : "");
        header.onclick = (e) => {
          if (e.target.closest("button")) return;
          if (collapsedFolders.has(key)) collapsedFolders.delete(key); else collapsedFolders.add(key);
          saveCollapsed();
          loadConversations();
        };
        if (folderId) {
          header.querySelector(".newInFolderBtn").onclick = (e) => {
            e.stopPropagation();
            newChat(folderId, folderName);
            text.focus();
          };
          header.querySelector(".renameFolderBtn").onclick = (e) => {
            e.stopPropagation();
            showPrompt("Rename folder", folderName, async (name) => {
              await apiJson("PATCH", `/folders/${folderId}`, { name });
              loadConversations();
            });
          };
          header.querySelector(".deleteFolderBtn").onclick = (e) => {
            e.stopPropagation();
            showConfirm(`Delete folder "${folderName}"? Chats inside will be kept, just unfiled.`, async () => {
              await apiJson("DELETE", `/folders/${folderId}`);
              loadConversations();
            });
          };
        }
        convs.appendChild(header);
        if (collapsed) return;
      }
      for (const c of items) convs.appendChild(convRow(c, allFolders));
    }

    function convRow(c, allFolders) {
      const el = document.createElement("div");
      el.className = "conv" + (c.id === conversationId ? " active" : "");
      el.innerHTML =
        `<span class="convTitle">${esc(c.title)}<small>${c.message_count} messages</small></span>` +
        `<span class="convActions">
           <button class="renameBtn" title="Rename">✏️</button>
           <button class="moveBtn" title="Move to folder">📁</button>
           <button class="deleteBtn" title="Delete">🗑️</button>
         </span>`;
      el.querySelector(".convTitle").onclick = () => openConversation(c.id);
      el.querySelector(".renameBtn").onclick = (e) => {
        e.stopPropagation();
        showPrompt("Rename chat", c.title, async (title) => {
          await apiJson("PATCH", `/conversations/${c.id}`, { title });
          loadConversations();
        });
      };
      el.querySelector(".deleteBtn").onclick = (e) => {
        e.stopPropagation();
        showConfirm(`Delete "${c.title}"? This cannot be undone.`, async () => {
          await apiJson("DELETE", `/conversations/${c.id}`);
          if (c.id === conversationId) newChat(); else loadConversations();
        });
      };
      el.querySelector(".moveBtn").onclick = (e) => {
        e.stopPropagation();
        showMoveMenu(el, c, allFolders);
      };
      return el;
    }

    function showMoveMenu(anchorEl, c, allFolders) {
      const existing = convs.querySelector(".moveMenu");
      if (existing) existing.remove();
      const wrap = document.createElement("div");
      wrap.className = "moveMenu";
      const select = document.createElement("select");
      select.innerHTML =
        `<option value="">No folder</option>` +
        allFolders
          .map((f) => `<option value="${f.id}"${f.id === c.folder_id ? " selected" : ""}>${esc(f.name)}</option>`)
          .join("");
      select.onclick = (e) => e.stopPropagation();
      select.onchange = async () => {
        await apiJson("PUT", `/conversations/${c.id}/folder`, { folder_id: select.value || null });
        loadConversations();
      };
      wrap.appendChild(select);
      anchorEl.after(wrap);
      select.focus();
    }
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".moveMenu") && !e.target.closest(".moveBtn")) {
        const m = convs.querySelector(".moveMenu");
        if (m) m.remove();
      }
    });

    function rememberConversation(id) {
      conversationId = id;
      try {
        if (id) localStorage.setItem("t2_conversation_id", id);
        else localStorage.removeItem("t2_conversation_id");
      } catch (e) { /* ignore */ }
    }

    async function openConversation(id) {
      const res = await fetch("/conversations/" + id);
      if (!res.ok) { newChat(); return; } // e.g. deleted, or from another install
      const c = await res.json();
      rememberConversation(id);
      pendingFolderId = null;
      log.innerHTML = "";
      for (const m of c.messages) addMsg(m.role, m.content);
      loadConversations();
    }

    let pendingFolderId = null;  // set by "+ new chat in this folder"; applied once the first message creates it

    function newChat(folderId, folderName) {
      rememberConversation(null);
      pendingFolderId = folderId || null;
      log.innerHTML = folderName
        ? `<div class="empty">New chat &mdash; will be saved in <b>${esc(folderName)}</b></div>`
        : '<div class="empty">Ask a question about company policy, or paste meeting notes to summarise.</div>';
      loadConversations();
    }

    async function sendMessage(message) {
      addMsg("user", message);
      send.disabled = true;
      const thinking = addMsg("bot", "…");
      const folderForNewChat = conversationId ? null : pendingFolderId;
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, conversation_id: conversationId }),
        });
        const data = await res.json();
        if (!res.ok) {
          // a clean error from the API (422 bad input, 503 provider down, 500
          // unexpected) - show its message instead of assuming a reply exists
          thinking.querySelector(".bubble").textContent =
            data.detail || `Something went wrong (${res.status}). Try again.`;
          return;
        }
        rememberConversation(data.conversation_id);
        if (folderForNewChat) {
          pendingFolderId = null;
          await apiJson("PUT", `/conversations/${data.conversation_id}/folder`, { folder_id: folderForNewChat });
        }
        thinking.remove();
        addMsg("bot", data.reply, data.route, { runId: data.run_id, traceUrl: data.trace_url }, data.sources);
        loadConversations();
      } catch (e) {
        thinking.querySelector(".bubble").textContent = "Something went wrong. Try again.";
      } finally {
        send.disabled = false;
        text.focus();
      }
    }

    form.onsubmit = (e) => {
      e.preventDefault();
      const message = text.value.trim();
      if (!message) return;
      text.value = "";
      text.style.height = "auto";
      sendMessage(message);
    };
    text.oninput = () => {
      text.style.height = "auto";
      text.style.height = text.scrollHeight + "px";
    };
    text.onkeydown = (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
    };
    document.getElementById("new").onclick = newChat;
    document.getElementById("newFolder").onclick = () => {
      showPrompt("New folder", "", async (name) => {
        await apiJson("POST", "/folders", { name });
        loadConversations();
      });
    };

    // ---- sign-in gate -----------------------------------------------------
    const authOverlay = document.getElementById("authOverlay");
    const authEmail = document.getElementById("authEmail");
    const authCode = document.getElementById("authCode");

    function showAuthOverlay() {
      authOverlay.style.display = "flex";
      document.getElementById("authStep1").style.display = "block";
      document.getElementById("authStep2").style.display = "none";
      document.getElementById("authError1").textContent = "";
      document.getElementById("authError2").textContent = "";
      authCode.value = "";
      authEmail.focus();
    }

    function enterApp(email) {
      authOverlay.style.display = "none";
      document.getElementById("userEmail").textContent = email;
      if (conversationId) openConversation(conversationId);
      else loadConversations();
      text.focus();
    }

    async function checkAuth() {
      const res = await fetch("/auth/me");
      const data = await res.json();
      if (data.email) enterApp(data.email);
      else showAuthOverlay();
    }

    document.getElementById("authSendCode").onclick = async () => {
      const email = authEmail.value.trim();
      const err = document.getElementById("authError1");
      err.textContent = "";
      if (!email) { err.textContent = "Enter your email."; return; }
      const btn = document.getElementById("authSendCode");
      btn.disabled = true; btn.textContent = "Sending…";
      try {
        const res = await fetch("/auth/request-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.detail || "Something went wrong."; return; }
        document.getElementById("authEmailShown").textContent = email;
        document.getElementById("authStep1").style.display = "none";
        document.getElementById("authStep2").style.display = "block";
        authCode.focus();
      } catch (e) {
        err.textContent = "Something went wrong. Try again.";
      } finally {
        btn.disabled = false; btn.textContent = "Send code";
      }
    };

    document.getElementById("authBack").onclick = () => {
      document.getElementById("authStep1").style.display = "block";
      document.getElementById("authStep2").style.display = "none";
    };

    async function submitCode() {
      const email = authEmail.value.trim();
      const code = authCode.value.trim();
      const err = document.getElementById("authError2");
      err.textContent = "";
      if (!code) { err.textContent = "Enter the code."; return; }
      const btn = document.getElementById("authVerify");
      btn.disabled = true; btn.textContent = "Verifying…";
      try {
        const res = await fetch("/auth/verify-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, code }),
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.detail || "Something went wrong."; return; }
        enterApp(data.email);
      } catch (e) {
        err.textContent = "Something went wrong. Try again.";
      } finally {
        btn.disabled = false; btn.textContent = "Verify";
      }
    }
    document.getElementById("authVerify").onclick = submitCode;
    authEmail.onkeydown = (e) => { if (e.key === "Enter") document.getElementById("authSendCode").click(); };
    authCode.onkeydown = (e) => { if (e.key === "Enter") submitCode(); };

    document.getElementById("signOut").onclick = async () => {
      await fetch("/auth/logout", { method: "POST" });
      rememberConversation(null);
      showAuthOverlay();
    };

    checkAuth();

    // ---- knowledge base panel -------------------------------------------
    const mainSection = document.getElementById("main");
    const kbSection = document.getElementById("kb");
    const navChat = document.getElementById("navChat");
    const navKb = document.getElementById("navKb");
    const kbSearch = document.getElementById("kbSearch");
    const kbDept = document.getElementById("kbDept");
    const kbLang = document.getElementById("kbLang");
    const kbType = document.getElementById("kbType");
    const kbCount = document.getElementById("kbCount");
    const kbList = document.getElementById("kbList");
    const kbDetail = document.getElementById("kbDetail");

    let kbAllDocs = null;   // fetched once, filtered client-side after that
    let kbActiveId = null;

    function showChat() {
      navChat.classList.add("active"); navKb.classList.remove("active");
      mainSection.style.display = "flex"; kbSection.style.display = "none";
    }
    function showKb() {
      navKb.classList.add("active"); navChat.classList.remove("active");
      mainSection.style.display = "none"; kbSection.style.display = "flex";
      if (kbAllDocs === null) loadKbDocuments();
    }
    navChat.onclick = showChat;
    navKb.onclick = showKb;

    async function loadKbDocuments() {
      kbList.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:13px;">Loading…</div>';
      const res = await fetch("/kb/documents");
      kbAllDocs = res.ok ? await res.json() : [];
      const depts = [...new Set(kbAllDocs.map((d) => d.department))].sort();
      for (const dep of depts) {
        const opt = document.createElement("option");
        opt.value = dep; opt.textContent = dep;
        kbDept.appendChild(opt);
      }
      renderKbList();
    }

    function renderKbList() {
      const q = kbSearch.value.trim().toLowerCase();
      const dep = kbDept.value, lang = kbLang.value, type = kbType.value;
      const filtered = (kbAllDocs || []).filter((d) =>
        (!q || d.title.toLowerCase().includes(q)) &&
        (!dep || d.department === dep) &&
        (!lang || d.language === lang) &&
        (!type || d.type === type)
      );
      kbCount.textContent = `${filtered.length} document${filtered.length === 1 ? "" : "s"}`;
      kbList.innerHTML = "";
      for (const d of filtered) {  // every matching document, not a capped preview
        const el = document.createElement("div");
        el.className = "kbItem" + (d.doc_id === kbActiveId ? " active" : "");
        const badge = d.status === "Active" ? "" : `<span class="kbBadge superseded">${esc(d.status)}</span>`;
        el.innerHTML =
          `<div class="t">${esc(d.title)}${badge}</div>` +
          `<div class="m">${esc(d.doc_id)} · ${esc(d.type)} · ${d.language.toUpperCase()} · ${esc(d.office)}</div>`;
        el.onclick = () => openKbDocument(d.doc_id);
        kbList.appendChild(el);
      }
    }

    async function openKbDocument(docId) {
      kbActiveId = docId;
      renderKbList();
      kbDetail.innerHTML = '<div class="empty">Loading…</div>';
      const res = await fetch("/kb/documents/" + encodeURIComponent(docId));
      if (!res.ok) { kbDetail.innerHTML = '<div class="empty">Could not load that document.</div>'; return; }
      const d = await res.json();
      const dir = isArabic(d.text) ? ' dir="rtl"' : "";
      kbDetail.innerHTML =
        `<div id="kbDetailHead"><h2>${esc(d.title)}</h2></div>` +
        `<div id="kbDetailMeta">` +
          `<span>${esc(d.doc_id)}</span><span>${esc(d.department)}</span><span>${esc(d.type)}</span>` +
          `<span>${d.language.toUpperCase()}</span><span>${esc(d.office)}</span>` +
          `<span>v${esc(d.version)}</span><span>${esc(d.status)}</span><span>${esc(d.effective_date)}</span>` +
        `</div>` +
        `<div id="kbDetailText"${dir}>${fmt(d.text)}</div>`;
      kbDetail.scrollTop = 0;
    }

    kbSearch.oninput = renderKbList;
    kbDept.onchange = renderKbList;
    kbLang.onchange = renderKbList;
    kbType.onchange = renderKbList;
  </script>
</body>
</html>
